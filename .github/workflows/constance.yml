name: Constance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  titre:
    name: Titre de PR (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - uses: Carolinedanslesnuages/constance/titre-pr@v1

  taille:
    name: Taille des fichiers (une responsabilité par fichier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Carolinedanslesnuages/constance/taille-fichiers@v1

  dependances:
    name: Dépendances (Madeleine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Carolinedanslesnuages/madeleine@v1

  nommage:
    name: Nommage des fichiers (kebab-case, PascalCase.vue)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Carolinedanslesnuages/constance/nommage-fichiers@v1

  poids:
    name: Poids du site (Solange)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collecter les projets et construire le site
        run: npm run collect && npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: Carolinedanslesnuages/solange@v1

  ecoindex:
    name: EcoIndex de la page (méthode officielle)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collecter les projets et construire le site
        run: npm run collect && npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Mesurer et calculer l'EcoIndex
        run: |
          set -o pipefail
          python3 -m venv "$RUNNER_TEMP/ecoindex"
          "$RUNNER_TEMP/ecoindex/bin/pip" install --quiet ecoindex_compute==5.10.0
          npx vite preview --port 4173 &
          npx wait-on@8.0.1 -t 30000 http://localhost:4173/
          node scripts/measure-ecoindex.mjs http://localhost:4173/ > "$RUNNER_TEMP/mesure-ecoindex.json"
          "$RUNNER_TEMP/ecoindex/bin/python" scripts/compute-ecoindex.py "$RUNNER_TEMP/mesure-ecoindex.json" "$RUNNER_TEMP/ecoindex.json" | tee -a "$GITHUB_STEP_SUMMARY"

  resume:
    name: Résumé pour la relecture (Annie)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: Carolinedanslesnuages/annie@v1

  anti-fuite:
    name: Anti-fuite (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: Carolinedanslesnuages/constance/anti-fuite@v1

  ecoconception:
    name: Écoconception (Eunice, RGESN 2024)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Construire le site
        run: npm run collect && npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: Carolinedanslesnuages/eunice@v1
