name: Site

on:
  push:
    branches:
      - main
  # Reconstruit chaque nuit : versions et fichiers des projets à jour
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      # Seuls les dépôts publics de site.config.json sont collectés (refus sinon).
      - name: Collecter les projets depuis GitHub
        run: npm run collecter
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Publier
        id: deploiement
        uses: actions/deploy-pages@v4
