<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>carolinedanslesnuages</title>
  <meta name="description" content="Projets open source">
  <style>
    :root { color-scheme: light dark; --bg: #ffffff; --fg: #3c3c43; --titre: #1b1b1f; --lien: #3451b2; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1b1b1f; --fg: #ebebf5cc; --titre: #fffff5db; --lien: #a8b1ff; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; box-sizing: border-box; }
    main { max-width: 560px; }
    h1 { margin: 0 0 8px; font-size: 32px; line-height: 40px; color: var(--titre); }
    p { margin: 0 0 6px; font-size: 18px; line-height: 28px; }
    a { color: var(--lien); }
  </style>
</head>
<body>
  <main>
    <h1>carolinedanslesnuages</h1>
    <p>Projets open source, simples et documentés.</p>
    <p>Les premiers arrivent bientôt. En attendant : <a href="https://github.com/Carolinedanslesnuages">GitHub</a>.</p>
  </main>
</body>
</html>
